name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift package and development app
        run: Scripts/verify.sh
      - name: Verify App Store archive
        run: Scripts/verify-app-store.sh
